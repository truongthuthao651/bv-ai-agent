# Knowledge pack — tài liệu tham khảo CÔNG KHAI (không phải tài liệu nội bộ).
#
# Mục đích: trợ lý cần kiến thức nền công khai (luật, thông tư, brochure sản
# phẩm đã công bố) mà không được phép gọi mạng lúc trả lời (CLAUDE.md quy tắc 4
# — ứng dụng phải chạy air-gapped). Cách làm: một người TẢI THỦ CÔNG các tệp
# công khai về thư mục này, ghi lại địa chỉ gốc ở đây, rồi chạy:
#
#     python scripts/ingest_knowledge_pack.py
#
# Địa chỉ `url` KHÔNG BAO GIỜ được ứng dụng truy cập — nó chỉ được hiển thị làm
# liên kết trong phần "Nguồn tham khảo" để nhân viên bấm vào xem bản gốc công
# khai. Trích dẫn của các tài liệu này được gắn nhãn "(nguồn công khai)".
#
# CHỈ đặt tài liệu công khai vào đây. Tài liệu nội bộ nạp qua trang quản trị.
#
# Cách dùng: sao chép tệp này thành `manifest.yaml` trong cùng thư mục và sửa.


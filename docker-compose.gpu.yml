# =============================================================================
# GPU override — layer ON TOP of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Requires the NVIDIA Container Toolkit on the host. Only Ollama needs the GPU.
# =============================================================================

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

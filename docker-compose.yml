# =============================================================================
# CPU-safe baseline stack. Everything runs locally / air-gapped after model pull.
#   docker compose up -d
# GPU: add the override -> docker-compose.gpu.yml (see README).
# All image tags are pinned — never use :latest.
# =============================================================================

services:
  ollama:
    image: ollama/ollama:0.9.6
    container_name: insurance-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: insurance-qdrant
    restart: unless-stopped
    environment:
      # No telemetry — the stack must not phone home.
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insurance-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Container-to-container hostnames override the .env host-facing defaults.
      # OLLAMA_BASE_URL is substituted from .env: on a Mac dev machine set it to
      # http://host.docker.internal:11434 to reach a native (Metal) Ollama;
      # DELETE the line from .env to use the in-compose "ollama" service. The
      # native .env default (http://localhost:11434) does NOT work in-container.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      QDRANT_URL: http://qdrant:6333
      # Force server-mode Qdrant in-container even when .env carries the native
      # no-Docker default (QDRANT_LOCAL_PATH=./qdrant_storage/local).
      QDRANT_LOCAL_PATH: ""
      # Any model weights fetched from the HF hub at runtime (e.g. Docling's
      # formula model on first PDF) cache under the host-mounted ./models dir,
      # so they persist and the stack runs offline afterwards.
      HF_HOME: /app/models/hf
    volumes:
      - ./data:/app/data
      # Persist downloaded model weights (reranker, etc.) on the host so the
      # stack can run offline and survives container recreation.
      - ./models:/app/models
      # Dev iteration: reflect app code edits on container restart, no rebuild.
      # (The image still COPYs app/ so it runs standalone without this mount.)
      - ./app:/app/app
      # Golden-set eval runs inside this container (docker compose exec api
      # python eval/run_ragas.py); mounted so results land back on the host.
      - ./eval:/app/eval
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - ollama
      - qdrant

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.5.4
    container_name: insurance-webui
    restart: unless-stopped
    environment:
      # Point the WebUI at our OpenAI-compatible FastAPI surface.
      OPENAI_API_BASE_URL: http://api:8000/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local-no-auth}
      WEBUI_AUTH: ${WEBUI_AUTH:-false}
      # Branding: app name shown in the browser tab/header, and the model
      # pre-selected in new chats (matches ASSISTANT_MODEL_ID served by our API).
      WEBUI_NAME: ${WEBUI_NAME:-Trợ lý AI Bảo Việt Life}
      DEFAULT_MODELS: ${DEFAULT_MODELS:-bao-viet-life}
    volumes:
      - open_webui_data:/app/backend/data
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    depends_on:
      - api

volumes:
  ollama_models:
  open_webui_data:

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#14456F" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<title>Đăng nhập — Trợ lý AI Bảo Việt Life</title>
<link rel="stylesheet" href="/tokens/styles.css" />
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: var(--font-sans);
  }
  .page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-8) var(--space-6);
    background: linear-gradient(155deg, var(--brand-navy) 0%, var(--brand-ink) 58%, #06192B 100%);
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    width: min(560px, 92vw);
    height: min(560px, 92vw);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(224,162,8,.14) 0%, rgba(42,122,193,.07) 40%, transparent 68%);
    pointer-events: none;
  }
  .stack {
    position: relative;
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .card {
    width: 100%;
    background: var(--surface);
    border: 1px solid rgba(255, 255, 255, .1);
    border-radius: var(--radius-xl);
    padding: var(--pad-card-lg);
    box-shadow: var(--shadow-lg);
  }
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-3);
    margin-bottom: var(--space-6);
    text-align: center;
  }
  .brand img {
    width: 40px;
    height: 40px;
    object-fit: contain;
  }
  .brand-name {
    font-size: var(--text-sm);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
    letter-spacing: var(--tracking-tight);
  }
  .card h1 {
    margin: 0 0 var(--space-5);
    font-size: var(--text-xl);
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight);
    color: var(--text-primary);
    text-align: center;
  }
  label {
    display: block;
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
    margin-bottom: var(--space-2);
  }
  input[type="password"], input[type="email"] {
    width: 100%;
    font: inherit;
    font-size: var(--text-sm);
    height: var(--control-h-lg);
    padding: 0 var(--pad-control-x);
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
  }
  input::placeholder { color: var(--text-muted); }
  input[type="password"]:focus, input[type="email"]:focus {
    outline: none;
    border-color: var(--focus-ring);
    box-shadow: 0 0 0 3px var(--accent-subtle);
  }
  input[type="password"]:focus-visible, input[type="email"]:focus-visible,
  button[type="submit"]:focus-visible, .switch-mode button:focus-visible,
  .back:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }
  button[type="submit"] {
    width: 100%;
    margin-top: var(--space-5);
    font: inherit;
    font-weight: var(--weight-bold);
    font-size: var(--text-base);
    height: var(--control-h-lg);
    border-radius: var(--radius-md);
    border: none;
    background: var(--accent);
    color: var(--text-on-accent);
    cursor: pointer;
    transition: background 150ms;
  }
  button[type="submit"]:hover:not(:disabled) { background: var(--accent-hover); }
  button[type="submit"]:disabled { opacity: .6; cursor: not-allowed; }
  #err {
    margin-top: var(--space-3);
    font-size: var(--text-xs);
    color: var(--danger);
    min-height: 16px;
    text-align: center;
  }
  .switch-mode {
    margin-top: var(--space-5);
    text-align: center;
    font-size: var(--text-sm);
    color: var(--text-secondary);
  }
  .switch-mode button {
    border: none;
    background: none;
    padding: 0;
    font: inherit;
    font-size: inherit;
    font-weight: var(--weight-semibold);
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .back {
    display: block;
    margin-top: var(--space-5);
    text-align: center;
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    color: rgba(255, 255, 255, .56);
    text-decoration: none;
    transition: color 150ms;
  }
  .back:hover { color: rgba(255, 255, 255, .88); }
  .hidden { display: none; }
  .field-gap { margin-bottom: var(--space-4); }
  .lang-toggle {
    position: absolute;
    top: var(--space-5);
    right: var(--space-5);
    z-index: 2;
    display: inline-flex;
    align-items: center;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: var(--radius-md);
    padding: 2px;
    background: rgba(255, 255, 255, 0.08);
  }
  .lang-toggle button {
    border: none;
    cursor: pointer;
    font: inherit;
    font-size: var(--text-2xs);
    font-weight: var(--weight-bold);
    letter-spacing: var(--tracking-wide);
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    background: transparent;
    color: rgba(255, 255, 255, 0.55);
    transition: background 150ms, color 150ms;
  }
  .lang-toggle button.active {
    background: rgba(224, 162, 8, 0.22);
    color: var(--brand-gold-light);
  }
  .lang-toggle button:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div class="page">
  <div class="glow" aria-hidden="true"></div>

  <div class="lang-toggle" role="group" aria-label="Language" id="langToggle">
    <button type="button" data-locale="vi" id="langVi">VI</button>
    <button type="button" data-locale="en" id="langEn">EN</button>
  </div>

  <div class="stack">
    <div class="card">
      <div class="brand">
        <img src="/assets/favicon.svg" alt="" aria-hidden="true" />
        <div class="brand-name" id="brandName">Trợ lý AI Bảo Việt Life</div>
      </div>

      <h1 id="panelTitle">Đăng nhập</h1>

      <form id="loginForm">
        <div class="field-gap">
          <label for="email" id="emailLabel">Email</label>
          <input type="email" id="email" name="email" autofocus autocomplete="username" placeholder="you@baoviet.com" required />
        </div>
        <div>
          <label for="password" id="passwordLabel">Mật khẩu</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <div id="confirmWrap" class="hidden field-gap" style="margin-top: var(--space-4);">
          <label for="confirmPassword" id="confirmLabel">Nhập lại mật khẩu</label>
          <input type="password" id="confirmPassword" autocomplete="new-password" />
        </div>
        <button id="submitBtn" type="submit">Đăng nhập</button>
        <div id="err"></div>
      </form>

      <p class="switch-mode">
        <span id="switchPrompt">Chưa có tài khoản?</span>
        <button type="button" id="modeToggle">Tạo tài khoản</button>
      </p>
    </div>

    <a class="back" href="/" id="backHome">← Trang chủ</a>
  </div>
</div>

<script>
  // Keep in sync with frontend/src/i18n/messages.js (login + productName + lang).
  const LOCALE_KEY = "bv-locale";
  const I18N = {
    vi: {
      productName: "Trợ lý AI Bảo Việt Life",
      langLabel: "Ngôn ngữ",
      documentTitle: "Đăng nhập — Trợ lý AI Bảo Việt Life",
      loginTitle: "Đăng nhập",
      signupTitle: "Tạo tài khoản",
      email: "Email",
      password: "Mật khẩu",
      confirmPassword: "Nhập lại mật khẩu",
      submitLogin: "Đăng nhập",
      submitSignup: "Tạo tài khoản",
      noAccount: "Chưa có tài khoản?",
      hasAccount: "Đã có tài khoản?",
      createAccount: "Tạo tài khoản",
      signIn: "Đăng nhập",
      backHome: "← Trang chủ",
      passwordMismatch: "Hai mật khẩu không khớp.",
      emailDomain: "Email phải thuộc miền @baoviet.com.",
      signupFailed: "Không thể tạo tài khoản. Vui lòng thử lại.",
      loginFailed: "Sai email hoặc mật khẩu. Vui lòng thử lại.",
      networkError: "Lỗi mạng: ",
    },
    en: {
      productName: "Bao Viet Life AI Assistant",
      langLabel: "Language",
      documentTitle: "Sign in — Bao Viet Life AI Assistant",
      loginTitle: "Sign in",
      signupTitle: "Create account",
      email: "Email",
      password: "Password",
      confirmPassword: "Confirm password",
      submitLogin: "Sign in",
      submitSignup: "Create account",
      noAccount: "Don't have an account?",
      hasAccount: "Already have an account?",
      createAccount: "Create account",
      signIn: "Sign in",
      backHome: "← Home",
      passwordMismatch: "Passwords do not match.",
      emailDomain: "Email must use the @baoviet.com domain.",
      signupFailed: "Could not create account. Please try again.",
      loginFailed: "Incorrect email or password. Please try again.",
      networkError: "Network error: ",
    },
  };

  const API_ERROR_VI = {
    "Sai email hoặc mật khẩu. Vui lòng thử lại.": "loginFailed",
    "Email phải thuộc miền @baoviet.com.": "emailDomain",
    "Không thể tạo tài khoản. Vui lòng thử lại.": "signupFailed",
  };

  function initialLocale() {
    const stored = localStorage.getItem(LOCALE_KEY);
    return stored === "en" ? "en" : "vi";
  }

  let locale = initialLocale();
  let signupMode = false;

  const form = document.getElementById("loginForm");
  const err = document.getElementById("err");
  const btn = document.getElementById("submitBtn");
  const params = new URLSearchParams(location.search);
  const next = params.get("next");
  const modeToggle = document.getElementById("modeToggle");
  const panelTitle = document.getElementById("panelTitle");
  const switchPrompt = document.getElementById("switchPrompt");
  const confirmWrap = document.getElementById("confirmWrap");
  const confirmPassword = document.getElementById("confirmPassword");
  const passwordInput = document.getElementById("password");
  const langToggle = document.getElementById("langToggle");
  const langVi = document.getElementById("langVi");
  const langEn = document.getElementById("langEn");

  function msg(key) {
    return I18N[locale][key] ?? key;
  }

  function localizeApiError(detail) {
    if (!detail || locale === "vi") return detail;
    if (detail.includes("Sai email hoặc mật khẩu")) return msg("loginFailed");
    if (detail.includes("Email phải thuộc miền")) return msg("emailDomain");
    const mapped = API_ERROR_VI[detail];
    return mapped ? msg(mapped) : detail;
  }

  function applyLocale() {
    document.documentElement.lang = locale === "en" ? "en" : "vi";
    document.title = msg("documentTitle");
    langToggle.setAttribute("aria-label", msg("langLabel"));
    langVi.classList.toggle("active", locale === "vi");
    langEn.classList.toggle("active", locale === "en");
    document.getElementById("brandName").textContent = msg("productName");
    document.getElementById("emailLabel").textContent = msg("email");
    document.getElementById("passwordLabel").textContent = msg("password");
    document.getElementById("confirmLabel").textContent = msg("confirmPassword");
    document.getElementById("backHome").textContent = msg("backHome");
    setMode(signupMode);
  }

  function setLocale(nextLocale) {
    locale = nextLocale === "en" ? "en" : "vi";
    localStorage.setItem(LOCALE_KEY, locale);
    applyLocale();
  }

  function setMode(signup) {
    signupMode = signup;
    panelTitle.textContent = signup ? msg("signupTitle") : msg("loginTitle");
    btn.textContent = signup ? msg("submitSignup") : msg("submitLogin");
    switchPrompt.textContent = signup ? msg("hasAccount") : msg("noAccount");
    modeToggle.textContent = signup ? msg("signIn") : msg("createAccount");
    confirmWrap.classList.toggle("hidden", !signup);
    confirmPassword.required = signup;
    passwordInput.autocomplete = signup ? "new-password" : "current-password";
    err.textContent = "";
  }

  langVi.addEventListener("click", () => setLocale("vi"));
  langEn.addEventListener("click", () => setLocale("en"));
  modeToggle.addEventListener("click", () => setMode(!signupMode));
  applyLocale();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    err.textContent = "";
    try {
      const email = document.getElementById("email").value.trim();
      const password = passwordInput.value;
      if (signupMode) {
        if (password !== confirmPassword.value) {
          err.textContent = msg("passwordMismatch");
          return;
        }
        if (!email.toLowerCase().endsWith("@baoviet.com")) {
          err.textContent = msg("emailDomain");
          return;
        }
      }
      const endpoint = signupMode ? "/register" : "/login";
      const resp = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "email=" + encodeURIComponent(email) + "&password=" + encodeURIComponent(password),
      });
      if (resp.ok) {
        const data = await resp.json().catch(() => ({}));
        let dest = next || "/chat/";
        if (dest.startsWith("/admin") && data.role !== "admin") dest = "/chat/";
        location.href = dest;
        return;
      }
      const data = await resp.json().catch(() => ({}));
      err.textContent = localizeApiError(data.detail) || (signupMode ? msg("signupFailed") : msg("loginFailed"));
    } catch (e2) {
      err.textContent = msg("networkError") + e2.message;
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
